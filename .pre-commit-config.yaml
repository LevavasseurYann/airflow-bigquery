# ============================================================================
# Pre-commit hooks — run automatically on `git commit` once installed:
#
#   pip install pre-commit
#   pre-commit install
#
# Run against the whole repo on demand:  pre-commit run --all-files
# ============================================================================
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: detect-private-key   # blocks accidentally committed credentials

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff          # lint
        args: [--fix]
      - id: ruff-format   # format
