# ============================================================================
# airflow-bigquery — local Apache Airflow 3 cluster (CeleryExecutor).
#
# Derived from the official Apache Airflow 3.1.0 docker-compose, adapted to:
#   * build a custom image (Dockerfile) with dbt, Cosmos and hr_pipeline,
#   * mount the include/ (dbt project, sample data) and src/ (package) folders,
#   * expose the hr_pipeline + dbt environment variables to every service,
#   * provision the `dbt` Airflow pool used to serialise DuckDB writes.
#
# WARNING: development configuration. Not hardened for production.
# See docs/production-gcp.md for the production deployment story.
#
# Quick start:
#   cp .env.example .env
#   docker compose build
#   docker compose up airflow-init
#   docker compose up -d
#   open http://localhost:8080   (login: airflow / airflow)
# ============================================================================
---
x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-airflow-bigquery:local}
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    # A clean UI for a portfolio project — no example DAGs.
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Loads config/airflow_local_settings.py — our cluster policies live there.
    # AIRFLOW_CONFIG points to the main Airflow config file (airflow.cfg).
    # Airflow creates it on first boot if absent (via `airflow config list` in
    # airflow-init). This is NOT how airflow_local_settings.py is discovered:
    # Airflow auto-loads that file from $AIRFLOW_HOME/config/ (i.e.
    # /opt/airflow/config/), which is mounted below — no extra configuration
    # is required for cluster policies to take effect.
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # ── hr_pipeline runtime configuration ──────────────────────────────────
    HR_ENV: ${HR_ENV:-local}
    DUCKDB_PATH: ${DUCKDB_PATH:-/opt/airflow/include/data/warehouse.duckdb}
    HR_RAW_DATA_DIR: ${HR_RAW_DATA_DIR:-/opt/airflow/include/data/raw}
    DBT_PROJECT_DIR: ${DBT_PROJECT_DIR:-/opt/airflow/include/dbt}
    DBT_PROFILES_DIR: ${DBT_PROFILES_DIR:-/opt/airflow/include/dbt}
    GCP_PROJECT: ${GCP_PROJECT:-}
    BQ_LOCATION: ${BQ_LOCATION:-EU}
    BQ_DATASET_RAW: ${BQ_DATASET_RAW:-raw_hr}
    GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/include:/opt/airflow/include
    - ${AIRFLOW_PROJ_DIR:-.}/src:/opt/airflow/src
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  # The API server hosts the React web UI and the REST + execution APIs.
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # In Airflow 3 the DAG processor is a dedicated, isolated service: DAG files
  # are parsed here, never inside the scheduler.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker --celery-hostname=celery@%h
    hostname: worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # One-shot bootstrap: DB migration, admin user, and the `dbt` resource pool.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, set AIRFLOW_UID=$$(id -u) in your .env file."
          echo
        fi
        if [[ -z "${AIRFLOW__CORE__FERNET_KEY}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW__CORE__FERNET_KEY is not set.\e[0m"
          echo "Connections and Variables will be stored unencrypted. Fine for local dev only."
          echo "Generate a key:  python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\""
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory is required. The Celery stack needs ~6GB to be comfortable."
          echo
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: At least 2 CPUs are recommended for Docker.\e[0m"
          echo
        fi
        echo "Creating missing opt dirs if missing:"
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config,include/data}
        echo "Airflow version:"
        /entrypoint airflow version
        echo "Running airflow config list to create the default config file if missing."
        /entrypoint airflow config list >/dev/null
        echo "Provisioning the 'dbt' pool (size 1 — DuckDB is single-writer):"
        /entrypoint airflow pools set dbt 1 "Serialises dbt model tasks; DuckDB allows a single writer."
        echo "Changing ownership of /opt/airflow to ${AIRFLOW_UID:-50000}:0"
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config,include}
        echo "Bootstrap complete."
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  # Optional CLI helper:  docker compose --profile debug run --rm airflow-cli airflow <cmd>
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  # Optional Celery monitoring UI:  docker compose --profile flower up flower
  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
