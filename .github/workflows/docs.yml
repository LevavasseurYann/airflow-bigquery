# ============================================================================
# Docs — build and deploy the MkDocs site to GitHub Pages on every push to
# main.  Uses the GitHub Pages native deployment API (source: "GitHub Actions"
# in Settings → Pages).  No gh-pages branch required.
# ============================================================================
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub Pages native deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('docs/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-docs-

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Install hr_pipeline
        run: pip install -e .

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
