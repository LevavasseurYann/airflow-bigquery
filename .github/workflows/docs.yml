# ============================================================================
# Docs — build and deploy the MkDocs site to GitHub Pages on every push to
# main.  mkdocs gh-deploy pushes the built HTML to the gh-pages branch.
# In Settings → Pages, set Source to: Deploy from a branch → gh-pages / root.
# ============================================================================
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('docs/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-docs-

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Install hr_pipeline
        run: pip install -e .

      - name: Deploy
        run: mkdocs gh-deploy --force
