# ============================================================================
# Continuous Integration.
#
# Four independent jobs, each proving one layer of the project:
#   lint            — ruff lint + format check
#   unit-tests      — fast, hermetic pytest of the hr_pipeline package
#   dbt-build       — runs the embedded dbt project end to end on DuckDB
#   dag-validation  — parses every DAG through a DagBag (Airflow + Cosmos)
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-lint-
      - run: pip install ruff==0.8.4
      - name: ruff check
        run: ruff check src dags tests scripts
      - name: ruff format --check
        run: ruff format --check src dags tests scripts

  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-unit-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-unit-
      - name: Install hr_pipeline with dev extras
        run: pip install -e ".[dev]"
      - name: Run the unit suite (Airflow-free)
        run: pytest -m "not dags" --cov=hr_pipeline --cov-report=term-missing

  dbt-build:
    name: dbt build (DuckDB)
    runs-on: ubuntu-latest
    env:
      HR_ENV: local
      HR_RAW_DATA_DIR: ${{ github.workspace }}/include/data/raw
      DUCKDB_PATH: ${{ github.workspace }}/include/data/ci_warehouse.duckdb
      DBT_TARGET: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dbt-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-dbt-
      - name: Install hr_pipeline + dbt
        run: pip install -e . "dbt-core>=1.11,<2.0" "dbt-duckdb>=1.10,<2.0"
      - name: Seed raw_hr.employees (runs the real ingestion logic)
        run: python scripts/seed_local_warehouse.py
      - name: dbt build — run + test every model, seed, snapshot
        run: dbt build --project-dir include/dbt --profiles-dir include/dbt
      - name: dbt source freshness
        run: dbt source freshness --project-dir include/dbt --profiles-dir include/dbt

  dag-validation:
    name: DAG validation (Airflow 3 + Cosmos)
    runs-on: ubuntu-latest
    env:
      HR_ENV: local
      AIRFLOW_HOME: /tmp/airflow_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Airflow 3.2 + Cosmos is the heaviest install (~500 MB). Cache it
      # keyed on the Airflow version so a version bump busts the cache.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-airflow-3.2.1-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-airflow-3.2.1-
            ${{ runner.os }}-pip-airflow-
      - name: Install Apache Airflow 3.2 (with the official constraints)
        run: |
          pip install "apache-airflow==3.2.1" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.2.1/constraints-3.12.txt"
      - name: Install Cosmos + the hr_pipeline package
        run: |
          pip install "dbt-core>=1.11,<2.0" "dbt-duckdb>=1.10,<2.0"
          pip install "astronomer-cosmos[dbt-duckdb]>=1.14,<2.0"
          pip install -e ".[dev]"
      - name: Initialise Airflow metadata database
        run: |
          mkdir -p $AIRFLOW_HOME
          airflow db migrate
      - name: Parse and validate the DAG bag
        run: pytest -m dags -v
